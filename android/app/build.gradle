plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.example.i_densfa'
    compileSdk 36
    ndkVersion "27.0.12077973"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.denave.isfa"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 72
        versionName "1.0.72"
    }
    signingConfigs {
        release {
            storeFile file('../keystone/isfa.jks')
            keyAlias 'key0'
            keyPassword 'denave'
            storePassword 'denave'
        }
    }
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include "armeabi-v7a", "arm64-v8a"
    //         universalApk true
    //     }
    // }

    // packagingOptions {
    //     jniLibs {
    //         useLegacyPackaging = false // ✅ Required for 16 KB alignment
    //     }
    //     resources {
    //         excludes += [ "META-INF/*" ]
    //     }
    // }
    buildFeatures {
        buildConfig = true // Enable BuildConfig generation
    }

    buildTypes {
        debug{
            debuggable true
            buildConfigField "Boolean","DEBUG_MODE","true"
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            debuggable false
            buildConfigField "Boolean","DEBUG_MODE","false"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:34.4.0"))
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
    implementation("com.google.firebase:firebase-crashlytics")
    implementation "com.google.firebase:firebase-analytics-ktx:22.5.0"
    implementation "androidx.camera:camera-core:1.6.0"
    implementation "androidx.camera:camera-camera2:1.6.0"
    implementation "androidx.camera:camera-lifecycle:1.6.0"
    implementation "androidx.camera:camera-video:1.6.0"
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
